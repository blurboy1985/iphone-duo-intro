name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        # Pages must already be switched on for this repo, with its source set to
        # GitHub Actions (Settings -> Pages -> Build and deployment -> Source).
        # configure-pages cannot do that first-time switch-on itself: GITHUB_TOKEN's
        # `pages: write` allows deploying to an existing site, but creating one needs
        # repo admin, which GITHUB_TOKEN does not have. Asking it to (`enablement: true`)
        # just fails with "Create Pages site failed: Resource not accessible by
        # integration", whatever the repository's visibility.
        uses: actions/configure-pages@v5

      - name: Assemble the site
        # The page is one self-contained file; PLAN.md and the workflow stay unpublished
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
